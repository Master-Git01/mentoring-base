<h1 class="form-todo__title">Создание задачи</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-todo">
  <mat-form-field class="form-todo__group">
    <mat-label class="form-todo__label" for="title">Заголовок</mat-label>
    <input matInput class="form-todo__input" id="title" type="text" formControlName="title" />
    <mat-error>Заголовок введен неправильно</mat-error>
  </mat-form-field>

  <mat-form-field class="form-todo__group">
    <mat-label class="form-todo__label" for="completed">Статус</mat-label>
    <mat-select class="form-todo__select" id="completed" formControlName="completed">
      <mat-option [value]="false">Не выполнено</mat-option>
      <mat-option [value]="true">Выполнено</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field class="form-todo__group">
    <mat-label class="form-todo__label" for="userId">ID пользователя</mat-label>
    <input matInput class="form-todo__input" id="userId" type="number" formControlName="userId" />
    <mat-error>ID введен неправильно</mat-error>
  </mat-form-field>

  <button mat-raised-button class="form-todo__button" type="submit" [disabled]="!form.valid">
    Создать задачу
  </button>
</form>
