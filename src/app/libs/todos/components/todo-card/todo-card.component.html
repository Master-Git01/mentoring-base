<article class="todos-card" tabindex="0">
  <header class="todos-card__header">
    <h3 class="todos-card__title">{{ todo.title }}</h3>
    <span class="todos-card__status" [class.todos-card__status--completed]="todo.completed">
      {{ todo.completed ? 'Выполнено' : 'В процессе' }}
    </span>
  </header>
  <footer class="todos-card__footer">
    <button class="todos-card__button" type="button" (click)="onDeleteTodo(todo.id)">
      Удалить
    </button>
  </footer>
</article>
