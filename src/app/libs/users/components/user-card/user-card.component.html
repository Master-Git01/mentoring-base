<article class="users-card" tabindex="0">
  <header class="users-card__header">
    <h3 class="users-card__name">{{ user.name }}</h3>
    <span class="users-card__company">{{ user.company.name }}</span>
  </header>
  <div class="users-card__info">
    <p class="users-card__email">
      <strong>Email:</strong>
      {{ user.email }}
    </p>
  </div>
  <footer class="users-card__footer">
    <button class="users-card__button" type="button" (click)="onDeleteUser(user.id)">
      Удалить
    </button>
  </footer>
</article>
