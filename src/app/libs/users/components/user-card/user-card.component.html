<mat-card class="user-card" appearance="outlined" boxShadow (dblclick)="onUserEdit()">
  <mat-card-header>
    <div mat-card-avatar class="user-card__header-image"></div>
    <mat-card-title>{{ user.name }}</mat-card-title>
    <mat-card-subtitle>{{ user.email }}</mat-card-subtitle>
  </mat-card-header>

  <img mat-card-image src="/assets/user.jpg" alt="Photo of User" />

  <mat-card-content>
    <p><strong>Website: </strong>{{ user.website }}</p>
    <p><strong>Company: </strong>{{ user.company.name }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button
      [matTooltip]="messageTooltip"
      mat-raised-button
      type="button"
      (click)="onUserDelete(user.id)"
      class="user-card__footer-btn"
    >
      <mat-icon>delete</mat-icon>
      Удалить пользователя
    </button>
  </mat-card-actions>
</mat-card>
